<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LocalFace • Offline P2P</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; 
            background:#000; color:white; height:100vh; overflow:hidden; 
            touch-action: manipulation;
        }
        .screen { position:absolute; inset:0; display:none; flex-direction:column; }
        .active { display:flex; }
        header { padding:20px; text-align:center; background:rgba(0,0,0,0.9); backdrop-filter:blur(20px); }
        .logo { font-size:24px; font-weight:600; }
        .pin-screen { flex:1; align-items:center; justify-content:center; gap:40px; flex-direction:column; }
        .pin-input { display:flex; gap:16px; }
        .pin-digit { 
            width:62px; height:72px; background:#1c1c1e; border:2px solid #555; border-radius:16px; 
            font-size:42px; text-align:center; line-height:66px; 
        }
        .keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; max-width:300px; }
        .key { 
            width:78px; height:78px; background:#1c1c1e; border-radius:50%; display:flex; 
            align-items:center; justify-content:center; font-size:32px; cursor:pointer; 
            -webkit-tap-highlight-color: rgba(255,255,255,0.3);
        }
        .key:active { background:#333; transform:scale(0.92); }
        .call-screen { flex:1; display:grid; grid-template-columns:repeat(2,1fr); gap:4px; padding:4px; background:#111; position:relative; }
        .video-tile { background:#1c1c1e; border-radius:16px; overflow:hidden; position:relative; }
        .video-tile video { width:100%; height:100%; object-fit:cover; }
        .local { grid-column: span 2; }
        .name-tag { position:absolute; bottom:12px; left:12px; background:rgba(0,0,0,0.7); padding:4px 12px; border-radius:9999px; font-size:14px; z-index:10; }
        .controls { position:absolute; bottom:30px; left:50%; transform:translateX(-50%); background:rgba(30,30,30,0.95); backdrop-filter:blur(20px); padding:12px 20px; border-radius:9999px; display:flex; gap:16px; z-index:100; }
        .control-btn { width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; background:#333; }
        .control-btn.red { background:#ff3b30; }
        .qr-overlay { position:absolute; bottom:100px; right:20px; background:white; padding:12px; border-radius:18px; box-shadow:0 4px 30px rgba(0,0,0,0.6); z-index:200; cursor:pointer; width:110px; height:110px; }
        .qr-overlay.full { width:340px !important; height:340px !important; bottom:50% !important; right:50% !important; transform:translate(50%,50%) !important; padding:25px; }
        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.95); display:none; align-items:center; justify-content:center; z-index:1000; }
    </style>
</head>
<body>

<div id="pinScreen" class="screen active">
    <header><div class="logo">LocalFace</div></header>
    <div class="pin-screen">
        <div style="text-align:center;">
            <h2>Enter Room PIN</h2>
            <p style="opacity:0.7;">Same 4-digit PIN as your friends</p>
        </div>
        <div class="pin-input" id="pinDisplay">
            <div class="pin-digit">_</div><div class="pin-digit">_</div><div class="pin-digit">_</div><div class="pin-digit">_</div>
        </div>
        <div class="keypad">
            <div class="key" onclick="addDigit(1)">1</div><div class="key" onclick="addDigit(2)">2</div><div class="key" onclick="addDigit(3)">3</div>
            <div class="key" onclick="addDigit(4)">4</div><div class="key" onclick="addDigit(5)">5</div><div class="key" onclick="addDigit(6)">6</div>
            <div class="key" onclick="addDigit(7)">7</div><div class="key" onclick="addDigit(8)">8</div><div class="key" onclick="addDigit(9)">9</div>
            <div class="key" onclick="clearPin()" style="font-size:26px;">⌫</div>
            <div class="key" onclick="addDigit(0)">0</div>
            <div class="key" onclick="joinRoom()" style="background:#007aff;color:white;">Join</div>
        </div>
        <!-- Hidden input to force iPad keyboard -->
        <input type="tel" id="hiddenInput" style="position:absolute; left:-9999px; opacity:0;" maxlength="4" inputmode="numeric" autocomplete="off">
    </div>
</div>

<div id="callScreen" class="screen">
    <header><div class="logo">Room: <span id="currentPin">0000</span></div></header>
    <div class="call-screen" id="videoGrid"></div>

    <div id="qrOverlay" class="qr-overlay" onclick="toggleQRSize()"><div id="qrcode"></div></div>

    <div class="controls">
        <div class="control-btn" id="micBtn" onclick="toggleMic()">🎤</div>
        <div class="control-btn" id="videoBtn" onclick="toggleVideo()">📹</div>
        <div class="control-btn" onclick="restartCamera()" style="font-size:20px;">🔄</div>
        <div class="control-btn" onclick="showSignalingModal()" style="font-size:22px;">📡</div>
        <div class="control-btn red" onclick="endCall()">✕</div>
    </div>
</div>

<div id="signalingModal" class="modal">
    <div class="modal-content" style="background:#1c1c1e;padding:24px;border-radius:20px;width:92%;max-width:420px;">
        <h3>Connect Video & Audio</h3>
        <p style="opacity:0.8;font-size:14px;">1. One person creates Offer and sends code<br>2. Other pastes and sends Answer back</p>
        <button onclick="createOffer()" style="width:100%;padding:14px;background:#007aff;color:white;border:none;border-radius:12px;margin:8px 0;">Create Offer</button>
        <textarea id="offerArea" placeholder="Paste code here..." style="width:100%;height:140px;background:#111;color:white;padding:12px;border-radius:12px;"></textarea>
        <button onclick="copyToClipboard()" style="width:100%;padding:12px;background:#333;color:white;border:none;border-radius:12px;margin:8px 0;">Copy</button>
        <button onclick="setRemoteDescription()" style="width:100%;padding:14px;background:#34c759;color:white;border:none;border-radius:12px;">Paste & Connect</button>
        <button onclick="closeSignalingModal()" style="margin-top:15px;color:#ff3b30;background:none;border:none;">Close</button>
    </div>
</div>

<script>
let currentPin = '';
let localStream = null;

function addDigit(d) {
    if (currentPin.length >= 4) return;
    currentPin += d;
    updatePinDisplay();
    document.getElementById('hiddenInput').focus();
}

function clearPin() {
    currentPin = currentPin.slice(0, -1);
    updatePinDisplay();
}

function updatePinDisplay() {
    const digits = document.querySelectorAll('.pin-digit');
    digits.forEach((el, i) => el.textContent = currentPin[i] || '_');
}

async function joinRoom() {
    if (currentPin.length !== 4) return alert("Enter full 4-digit PIN");
    document.getElementById('pinScreen').classList.remove('active');
    document.getElementById('callScreen').classList.add('active');
    document.getElementById('currentPin').textContent = currentPin;
    await startLocalVideo();
    generateQR(false);
}

function generateQR(large) {
    const container = document.getElementById('qrcode');
    container.innerHTML = '';
    const url = `${window.location.origin}${window.location.pathname}?pin=${currentPin}`;
    new QRCode(container, { text: url, width: large ? 290 : 82, height: large ? 290 : 82 });
}

function toggleQRSize() {
    const overlay = document.getElementById('qrOverlay');
    const full = overlay.classList.toggle('full');
    generateQR(full);
}

// Basic WebRTC placeholders
async function startLocalVideo() {
    try {
        localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
        const tile = document.createElement('div');
        tile.className = 'video-tile local';
        tile.innerHTML = `<video autoplay playsinline muted></video><div class="name-tag">You</div>`;
        document.getElementById('videoGrid').appendChild(tile);
        tile.querySelector('video').srcObject = localStream;
    } catch(e) { alert("Camera permission needed"); }
}

function createOffer() { 
    document.getElementById('offerArea').value = "OFFER-" + Date.now();
    alert("Offer created! Copy and send to friend.");
}
function setRemoteDescription() { alert("Answer accepted! (In real use this starts the video stream)"); }
function copyToClipboard() { navigator.clipboard.writeText(document.getElementById('offerArea').value); alert("Copied!"); }

function showSignalingModal() { document.getElementById('signalingModal').style.display = 'flex'; }
function closeSignalingModal() { document.getElementById('signalingModal').style.display = 'none'; }

function toggleMic(){} function toggleVideo(){} function restartCamera(){} 
function endCall(){ if(confirm("End?")) location.reload(); }

// Auto-focus hidden input on iPad for keyboard
document.getElementById('pinScreen').addEventListener('touchstart', () => {
    document.getElementById('hiddenInput').focus();
});

window.onload = () => {
    const pin = new URLSearchParams(location.search).get('pin');
    if (pin && pin.length === 4) {
        currentPin = pin;
        joinRoom();
    }
};
</script>
</body>
</html>
