<!DOCTYPE html>
<html>
<head>
    <title>FaceTime Auto</title>
    <style>
        body { background: #000; color: #fff; text-align: center; }
        video { width: 45%; background: #222; }
    </style>
    <!-- Include PeerJS library -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

    <input type="text" id="room" placeholder="Enter Room Code">
    <button onclick="start()">Join/Call</button>

    <video id="local" autoplay playsinline muted></video>
    <video id="remote" autoplay playsinline></video>

    <script>
        let peer;
        let localStream;

        async function start() {
            const roomCode = document.getElementById('room').value;
            // PeerJS creates the connection automatically using the code as the ID
            peer = new Peer(roomCode); 

            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('local').srcObject = localStream;

            // Listen for incoming calls
            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', stream => document.getElementById('remote').srcObject = stream);
            });

            // Make a call
            const targetCode = prompt("Enter the code of the person you are calling:");
            const call = peer.call(targetCode, localStream);
            call.on('stream', stream => document.getElementById('remote').srcObject = stream);
        }
    </script>
</body>
</html>
