<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pro P2P Call</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        .video-wrapper { display: flex; gap: 10px; width: 100%; justify-content: center; }
        video { width: 45%; background: #111; border-radius: 8px; }
        .controls { margin-top: 15px; display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
        button { padding: 10px; cursor: pointer; background: #333; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <video id="local" autoplay playsinline muted></video>
        <video id="remote" autoplay playsinline></video>
    </div>

    <div class="controls">
        <span id="myID">Your ID: Loading...</span>
        <input type="text" id="targetID" placeholder="Friend's ID">
        <button onclick="callFriend()">Call</button>
        <button onclick="flipCamera()">Flip Camera</button>
        <button onclick="shareScreen()">Share Screen</button>
    </div>

    <script>
        let peer, localStream, currentCall, useFront = true;
        const localVideo = document.getElementById('local');
        const remoteVideo = document.getElementById('remote');

        async function init(facing = 'user') {
            localStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: facing }, 
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
            });
            localVideo.srcObject = localStream;
            
            peer = new Peer();
            peer.on('open', id => document.getElementById('myID').innerText = "Your ID: " + id);
            peer.on('call', call => {
                currentCall = call;
                call.answer(localStream);
                call.on('stream', s => remoteVideo.srcObject = s);
            });
        }

        async function flipCamera() {
            useFront = !useFront;
            localStream.getTracks().forEach(t => t.stop());
            await init(useFront ? 'user' : 'environment');
            if (currentCall) {
                const videoTrack = localStream.getVideoTracks()[0];
                currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video').replaceTrack(videoTrack);
            }
        }

        async function shareScreen() {
            const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            const videoTrack = screenStream.getVideoTracks()[0];
            currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video').replaceTrack(videoTrack);
            videoTrack.onended = () => { /* Logic to revert to camera */ };
        }

        function callFriend() {
            currentCall = peer.call(document.getElementById('targetID').value, localStream);
            currentCall.on('stream', s => remoteVideo.srcObject = s);
        }

        init();
    </script>
</body>
</html>
