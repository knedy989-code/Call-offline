<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fixed Pro P2P Call</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; }
        video { width: 45%; background: #111; border-radius: 8px; border: 2px solid #333; }
        .controls { margin: 20px; padding: 20px; background: #111; }
        .btn { padding: 12px; margin: 5px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <video id="local" autoplay playsinline muted></video>
        <video id="remote" autoplay playsinline></video>
    </div>

    <div class="controls">
        <h3>ID: <span id="myID">...</span> <button onclick="copyID()" class="btn">Copy</button></h3>
        <input type="text" id="targetID" placeholder="Friend's ID">
        <button onclick="callFriend()" class="btn">Call</button>
        <button onclick="shareScreen()" class="btn">Share Screen</button>
        <button onclick="flipCamera()" class="btn">Flip Camera</button>
        <button onclick="requestRecall()" class="btn" style="background:#d35400;">Request Recall</button>
        <button onclick="leaveCall()" class="btn" style="background:#c0392b;">Leave Call</button>
        <button onclick="enableAudio()" class="btn" style="background:#0f0;">Enable Audio</button>
    </div>

    <script>
        const remoteVideo = document.getElementById('remote');
        let peer, localStream, currentCall, useFront = true;

        async function init(facing = 'user') {
            // Keep the audio track alive by separating it if needed
            localStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: facing }, 
                audio: { echoCancellation: true, noiseSuppression: true } 
            });
            document.getElementById('local').srcObject = localStream;
            
            if (!peer) {
                peer = new Peer();
                peer.on('open', id => document.getElementById('myID').innerText = id);
                peer.on('call', call => {
                    currentCall = call;
                    call.answer(localStream);
                    call.on('stream', s => remoteVideo.srcObject = s);
                });
            }
        }

        async function flipCamera() {
            useFront = !useFront;
            const newStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: useFront ? 'user' : 'environment' }, 
                audio: false // Don't request audio again!
            });
            
            const newVideoTrack = newStream.getVideoTracks()[0];
            const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
            sender.replaceTrack(newVideoTrack);
            document.getElementById('local').srcObject = new MediaStream([newVideoTrack]);
        }

        function callFriend() {
            const id = document.getElementById('targetID').value;
            currentCall = peer.call(id, localStream);
            currentCall.on('stream', s => remoteVideo.srcObject = s);
        }

        function enableAudio() {
            remoteVideo.muted = false;
            remoteVideo.play();
        }

        // ... (Keep other functions: shareScreen, requestRecall, leaveCall, copyID)
        init();
    </script>
</body>
</html>
