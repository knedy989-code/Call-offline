<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalFace • Offline</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; background:#000; color:white; height:100vh; overflow:hidden; }
        .screen { position:absolute; inset:0; display:none; flex-direction:column; }
        .active { display:flex; }
        header { padding:20px; text-align:center; background:rgba(0,0,0,0.9); backdrop-filter:blur(20px); }
        .logo { font-size:22px; font-weight:600; }
        .call-screen { flex:1; display:grid; grid-template-columns:repeat(2,1fr); gap:4px; padding:4px; background:#111; position:relative; }
        .video-tile { background:#1c1c1e; border-radius:16px; overflow:hidden; position:relative; }
        .video-tile video { width:100%; height:100%; object-fit:cover; }
        .local { grid-column: span 2; }
        .name-tag { position:absolute; bottom:12px; left:12px; background:rgba(0,0,0,0.7); padding:4px 12px; border-radius:9999px; font-size:14px; z-index:10; }
        .controls { position:absolute; bottom:30px; left:50%; transform:translateX(-50%); background:rgba(30,30,30,0.95); backdrop-filter:blur(20px); padding:12px 20px; border-radius:9999px; display:flex; gap:16px; z-index:100; }
        .control-btn { width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; background:#333; }
        .control-btn.red { background:#ff3b30; }
        .qr-overlay { position:absolute; bottom:100px; right:20px; background:white; padding:12px; border-radius:18px; box-shadow:0 4px 30px rgba(0,0,0,0.6); z-index:200; cursor:pointer; width:110px; height:110px; }
        .qr-overlay.full { width:340px !important; height:340px !important; bottom:50% !important; right:50% !important; transform:translate(50%,50%) !important; padding:25px; }
        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.95); display:none; align-items:center; justify-content:center; z-index:1000; }
    </style>
</head>
<body>

<div id="pinScreen" class="screen active">
    <header><div class="logo">LocalFace</div></header>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;">
        <h2>Enter 4-digit PIN</h2>
        <div id="pinDisplay" style="display:flex;gap:15px;">
            <div class="pin-digit" style="width:58px;height:68px;background:#1c1c1e;border:2px solid #333;border-radius:14px;font-size:38px;text-align:center;line-height:62px;">_</div>
            <div class="pin-digit" style="width:58px;height:68px;background:#1c1c1e;border:2px solid #333;border-radius:14px;font-size:38px;text-align:center;line-height:62px;">_</div>
            <div class="pin-digit" style="width:58px;height:68px;background:#1c1c1e;border:2px solid #333;border-radius:14px;font-size:38px;text-align:center;line-height:62px;">_</div>
            <div class="pin-digit" style="width:58px;height:68px;background:#1c1c1e;border:2px solid #333;border-radius:14px;font-size:38px;text-align:center;line-height:62px;">_</div>
        </div>
        <div onclick="joinRoom()" style="background:#007aff;color:white;padding:16px 50px;border-radius:9999px;font-size:18px;cursor:pointer;">Join Room</div>
    </div>
</div>

<div id="callScreen" class="screen">
    <header><div class="logo">Room: <span id="currentPin">0000</span></div></header>
    <div class="call-screen" id="videoGrid"></div>

    <div id="qrOverlay" class="qr-overlay" onclick="toggleQRSize()"><div id="qrcode"></div></div>

    <div class="controls">
        <div class="control-btn" id="micBtn" onclick="toggleMic()">🎤</div>
        <div class="control-btn" id="videoBtn" onclick="toggleVideo()">📹</div>
        <div class="control-btn" onclick="restartCamera()" style="font-size:20px;">🔄</div>
        <div class="control-btn" onclick="showSignalingModal()" style="font-size:22px;">📡</div>
        <div class="control-btn red" onclick="endCall()">✕</div>
    </div>
</div>

<!-- SIGNALING MODAL -->
<div id="signalingModal" class="modal">
    <div class="modal-content" style="background:#1c1c1e;padding:24px;border-radius:20px;width:92%;max-width:420px;">
        <h3>Connect Video & Audio</h3>
        <p style="font-size:14px;opacity:0.8;margin:15px 0;">You must do this handshake with each person:</p>
        <button onclick="createOffer()" style="width:100%;padding:14px;background:#007aff;color:white;border:none;border-radius:12px;margin-bottom:10px;">1. Create Offer → Copy</button>
        <textarea id="offerArea" placeholder="Paste received code here..." style="width:100%;height:150px;background:#111;color:white;padding:12px;border-radius:12px;"></textarea>
        <button onclick="copyToClipboard()" style="width:100%;padding:12px;background:#333;color:white;border:none;border-radius:12px;margin:8px 0;">Copy My Code</button>
        <button onclick="setRemoteDescription()" style="width:100%;padding:14px;background:#34c759;color:white;border:none;border-radius:12px;">2. Paste & Connect</button>
        <button onclick="closeSignalingModal()" style="margin-top:15px;color:#ff3b30;background:none;border:none;">Close</button>
    </div>
</div>

<script>
let currentPin = '';
let localStream = null;
let peers = new Map();
let myId = Math.random().toString(36).substring(2, 10);
let currentJoinUrl = '';

async function startLocalVideo() {
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
    const grid = document.getElementById('videoGrid');
    let localTile = document.createElement('div');
    localTile.className = 'video-tile local';
    localTile.innerHTML = `<video autoplay playsinline muted></video><div class="name-tag">You</div>`;
    grid.appendChild(localTile);
    localTile.querySelector('video').srcObject = localStream;
}

function addVideoTile(id, stream) {
    if (document.getElementById(id)) return;
    const tile = document.createElement('div');
    tile.className = 'video-tile';
    tile.id = id;
    tile.innerHTML = `<video autoplay playsinline></video><div class="name-tag">Friend</div>`;
    document.getElementById('videoGrid').appendChild(tile);
    tile.querySelector('video').srcObject = stream;
}

async function createPeerConnection() {
    const pc = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.l.google.com:19302'}]});
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    pc.ontrack = e => addVideoTile('remote', e.streams[0]);
    pc.onicecandidate = e => {
        if (e.candidate) console.log("ICE candidate generated");
    };

    peers.set('main', pc);
    return pc;
}

async function createOffer() {
    const pc = await createPeerConnection();
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    document.getElementById('offerArea').value = btoa(JSON.stringify({type: 'offer', sdp: offer.sdp, from: myId}));
}

async function setRemoteDescription() {
    const dataStr = document.getElementById('offerArea').value.trim();
    if (!dataStr) return alert("Paste the code first");
    try {
        const data = JSON.parse(atob(dataStr));
        let pc = peers.get('main') || await createPeerConnection();
        await pc.setRemoteDescription({type: data.type, sdp: data.sdp});
        if (data.type === 'offer') {
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            document.getElementById('offerArea').value = btoa(JSON.stringify({type: 'answer', sdp: answer.sdp, from: myId}));
        }
        alert("✅ Connection established! Video should appear soon.");
    } catch(e) {
        alert("Error: " + e.message);
    }
}

function copyToClipboard() {
    navigator.clipboard.writeText(document.getElementById('offerArea').value);
    alert("✅ Copied! Send to your friend.");
}

function joinRoom() {
    if (currentPin.length !== 4) return alert("Enter 4 digits");
    document.getElementById('pinScreen').classList.remove('active');
    document.getElementById('callScreen').classList.add('active');
    document.getElementById('currentPin').textContent = currentPin;

    const base = window.location.href.split('?')[0];
    currentJoinUrl = `${base}?pin=${currentPin}`;
    generateQR(false);
    startLocalVideo();
}

function generateQR(large) {
    const container = document.getElementById('qrcode');
    container.innerHTML = '';
    new QRCode(container, {
        text: currentJoinUrl,
        width: large ? 290 : 82,
        height: large ? 290 : 82
    });
}

function toggleQRSize() {
    const overlay = document.getElementById('qrOverlay');
    const isFull = overlay.classList.toggle('full');
    generateQR(isFull);
}

function showSignalingModal() { document.getElementById('signalingModal').style.display = 'flex'; }
function closeSignalingModal() { document.getElementById('signalingModal').style.display = 'none'; }

function toggleMic() { /* implement */ }
function toggleVideo() { /* implement */ }
function restartCamera() { startLocalVideo(); }
function endCall() { location.reload(); }

// Simple PIN keypad
document.addEventListener('click', e => {
    if (e.target.textContent >= '0' && e.target.textContent <= '9') {
        if (currentPin.length < 4) currentPin += e.target.textContent;
        updatePinDisplay();
    }
});

function updatePinDisplay() {
    const digits = document.querySelectorAll('.pin-digit');
    digits.forEach((el, i) => el.textContent = currentPin[i] || '_');
}

window.onload = () => {
    const pin = new URLSearchParams(location.search).get('pin');
    if (pin && pin.length === 4) {
        currentPin = pin;
        joinRoom();
    }
};
</script>
</body>
</html>
