<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>P2P Pro Call</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; }
        video { width: 45%; background: #222; border-radius: 8px; }
        .controls { margin: 20px; padding: 20px; background: #111; }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <video id="local" autoplay playsinline muted></video>
        <video id="remote" autoplay playsinline></video>
    </div>

    <div class="controls">
        <h3>Your ID: <span id="myID" style="color: #0f0;">...</span></h3>
        <input type="text" id="targetID" placeholder="Enter Friend's ID">
        <button onclick="callFriend()">Call Friend</button>
    </div>

    <script>
        const myIDDisplay = document.getElementById('myID');
        const targetInput = document.getElementById('targetID');
        let peer, localStream;

        async function init() {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('local').srcObject = localStream;

            // 1. Create peer with a random ID
            peer = new Peer(); 

            peer.on('open', (id) => {
                myIDDisplay.innerText = id; // This is the ID you share with your friend
            });

            // 2. Listen for incoming calls
            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', s => document.getElementById('remote').srcObject = s);
            });
        }

        // 3. Initiate call to a friend's ID
        function callFriend() {
            const id = targetInput.value;
            const call = peer.call(id, localStream);
            call.on('stream', s => document.getElementById('remote').srcObject = s);
        }

        init();
    </script>
</body>
</html>
