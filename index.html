<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalFace • Offline P2P</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600&display=swap');
        
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; background:#000; color:white; height:100vh; overflow:hidden; }
        .screen { position:absolute; inset:0; display:none; flex-direction:column; }
        .active { display:flex; }

        header { padding:20px; text-align:center; background:rgba(0,0,0,0.9); backdrop-filter:blur(20px); z-index:10; }
        .logo { font-size:22px; font-weight:600; }

        .pin-screen { flex:1; align-items:center; justify-content:center; gap:40px; flex-direction:column; }
        .pin-input { display:flex; gap:12px; }
        .pin-digit { width:55px; height:65px; background:#1c1c1e; border:2px solid #333; border-radius:12px; font-size:36px; text-align:center; line-height:60px; }

        .call-screen { flex:1; display:grid; grid-template-columns:repeat(2,1fr); gap:4px; padding:4px; background:#111; position:relative; }
        .video-tile { background:#1c1c1e; border-radius:16px; overflow:hidden; position:relative; }
        .video-tile video { width:100%; height:100%; object-fit:cover; }
        .local { grid-column: span 2; }
        .name-tag { position:absolute; bottom:12px; left:12px; background:rgba(0,0,0,0.7); padding:4px 12px; border-radius:9999px; font-size:14px; z-index:10; }

        .controls {
            position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
            background:rgba(30,30,30,0.95); backdrop-filter:blur(20px);
            padding:12px 20px; border-radius:9999px; display:flex; gap:20px; z-index:100;
        }
        .control-btn { width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; background:#333; }
        .control-btn.red { background:#ff3b30; }

        .qr-overlay { position:absolute; bottom:100px; right:20px; background:white; padding:12px; border-radius:18px; box-shadow:0 4px 30px rgba(0,0,0,0.6); z-index:200; cursor:pointer; transition:all 0.4s ease; width:100px; height:100px; }
        .qr-overlay.full { width:340px !important; height:340px !important; bottom:50% !important; right:50% !important; transform:translate(50%,50%) !important; padding:25px; }

        .room-header { position:absolute; top:70px; left:50%; transform:translateX(-50%); background:rgba(0,122,255,0.9); padding:6px 18px; border-radius:9999px; font-size:13px; z-index:50; }

        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.95); display:none; align-items:center; justify-content:center; z-index:1000; }
    </style>
</head>
<body>

    <!-- PIN SCREEN -->
    <div id="pinScreen" class="screen active">
        <header><div class="logo">LocalFace</div></header>
        <div class="pin-screen">
            <div style="text-align:center;">
                <h2>Join or Create Room</h2>
                <p style="opacity:0.7; max-width:280px;">Enter the same 4-digit PIN as your friends</p>
            </div>
            <div class="pin-input" id="pinDisplay">
                <div class="pin-digit">_</div><div class="pin-digit">_</div><div class="pin-digit">_</div><div class="pin-digit">_</div>
            </div>
            <div class="keypad" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:280px;">
                <div class="key" onclick="addDigit(1)">1</div><div class="key" onclick="addDigit(2)">2</div><div class="key" onclick="addDigit(3)">3</div>
                <div class="key" onclick="addDigit(4)">4</div><div class="key" onclick="addDigit(5)">5</div><div class="key" onclick="addDigit(6)">6</div>
                <div class="key" onclick="addDigit(7)">7</div><div class="key" onclick="addDigit(8)">8</div><div class="key" onclick="addDigit(9)">9</div>
                <div class="key" onclick="clearPin()">⌫</div><div class="key" onclick="addDigit(0)">0</div>
                <div class="key" onclick="joinRoom()" style="background:#007aff;color:white;">Join Room</div>
            </div>
        </div>
    </div>

    <!-- CALL SCREEN -->
    <div id="callScreen" class="screen">
        <header>
            <div class="logo">LocalFace</div>
        </header>

        <div class="room-header" id="roomHeader">Room PIN: <span id="currentPinDisplay">0000</span></div>

        <div class="call-screen" id="videoGrid"></div>

        <div id="qrOverlay" class="qr-overlay" onclick="toggleQRSize()">
            <div id="qrcode"></div>
        </div>

        <div class="controls">
            <div class="control-btn" id="micBtn" onclick="toggleMic()">🎤</div>
            <div class="control-btn" id="videoBtn" onclick="toggleVideo()">📹</div>
            <div class="control-btn" onclick="restartCamera()" style="font-size:20px;">🔄</div>
            <div class="control-btn" onclick="showSignalingModal()" style="font-size:22px;">📡</div>
            <div class="control-btn red" onclick="endCall()">✕</div>
        </div>
    </div>

    <!-- SIGNALING MODAL -->
    <div id="signalingModal" class="modal">
        <div class="modal-content" style="background:#1c1c1e;padding:24px;border-radius:20px;width:92%;max-width:380px;text-align:center;">
            <h3>Connect with Others</h3>
            <p style="font-size:14px;opacity:0.8;margin:15px 0;">Everyone must be on the same Wi-Fi and use the same PIN.<br><br>Use this to manually connect video:</p>
            <button onclick="createOffer()" style="width:100%;padding:14px;margin:8px 0;background:#007aff;border:none;border-radius:12px;color:white;">1. Create Offer</button>
            <textarea id="offerArea" placeholder="Paste offer or answer here..." style="width:100%;height:130px;background:#111;border:none;color:white;padding:12px;border-radius:12px;margin:12px 0;font-family:monospace;font-size:12px;"></textarea>
            <button onclick="copyToClipboard()" style="width:100%;padding:12px;background:#333;border:none;border-radius:12px;color:white;">Copy to Clipboard</button>
            <button onclick="setRemoteDescription()" style="width:100%;padding:14px;margin-top:12px;background:#34c759;border:none;border-radius:12px;color:white;">2. Paste & Connect</button>
            <button onclick="closeSignalingModal()" style="margin-top:20px;background:none;border:none;color:#ff3b30;">Close</button>
        </div>
    </div>

    <script>
        let currentPin = '';
        let localStream = null;
        let peers = new Map();
        let myId = Math.random().toString(36).slice(2,10);
        let isMuted = false;
        let isVideoOff = false;
        let isQRFull = false;
        let currentQRUrl = '';
        let localVideoTile = null;

        function checkURLParams() {
            const params = new URLSearchParams(window.location.search);
            const pin = params.get('pin');
            if (pin && pin.length === 4) {
                currentPin = pin;
                setTimeout(() => joinRoom(true), 100);
            }
        }

        async function startLocalVideo() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: { echoCancellation: true, noiseSuppression: true } 
                });
                
                const grid = document.getElementById('videoGrid');
                localVideoTile = document.createElement('div');
                localVideoTile.className = 'video-tile local';
                localVideoTile.innerHTML = `<video id="localVideo" autoplay playsinline muted></video><div class="name-tag">You</div>`;
                grid.appendChild(localVideoTile);
                document.getElementById('localVideo').srcObject = localStream;
            } catch(e) {
                console.error(e);
            }
        }

        function addVideoTile(id, stream) {
            if (document.getElementById('tile-' + id)) return;
            const tile = document.createElement('div');
            tile.className = 'video-tile';
            tile.id = 'tile-' + id;
            tile.innerHTML = `<video autoplay playsinline></video><div class="name-tag">Peer</div>`;
            document.getElementById('videoGrid').appendChild(tile);
            tile.querySelector('video').srcObject = stream;
        }

        async function createPeerConnection(peerId) {
            const pc = new RTCPeerConnection({ iceServers: [{urls: 'stun:stun.l.google.com:19302'}] });
            if (localStream) localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            pc.ontrack = e => addVideoTile(peerId, e.streams[0]);
            peers.set(peerId, pc);
            return pc;
        }

        // WebRTC signaling (same reliable flow)
        async function createOffer() {
            const pc = await createPeerConnection("peer-" + Date.now());
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            document.getElementById('offerArea').value = btoa(JSON.stringify({
                type: "offer", 
                sdp: offer.sdp, 
                from: myId,
                pin: currentPin
            }));
        }

        async function setRemoteDescription() {
            const str = document.getElementById('offerArea').value.trim();
            if (!str) return alert("Paste the code first");
            try {
                const data = JSON.parse(atob(str));
                let pc = peers.get(data.from) || await createPeerConnection(data.from);
                if (data.type === "offer") {
                    await pc.setRemoteDescription({type: "offer", sdp: data.sdp});
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    document.getElementById('offerArea').value = btoa(JSON.stringify({type:"answer", sdp:answer.sdp, from:myId}));
                } else if (data.type === "answer") {
                    await pc.setRemoteDescription({type:"answer", sdp:data.sdp});
                }
                alert("✅ Connection successful!");
            } catch(e) { alert("Invalid code"); }
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(document.getElementById('offerArea').value);
            alert("✅ Copied! Send to your friend.");
        }

        function showSignalingModal() { document.getElementById('signalingModal').style.display = 'flex'; }
        function closeSignalingModal() { document.getElementById('signalingModal').style.display = 'none'; }

        function addDigit(d) {
            if (currentPin.length >= 4) return;
            currentPin += d;
            updatePinDisplay();
        }
        function clearPin() { currentPin = ''; updatePinDisplay(); }
        function updatePinDisplay() {
            document.querySelectorAll('.pin-digit').forEach((el,i) => el.textContent = currentPin.length > i ? '•' : '_');
        }

        async function joinRoom(auto = false) {
            if (!auto && currentPin.length !== 4) return alert("Enter a 4-digit PIN");

            document.getElementById('pinScreen').classList.remove('active');
            document.getElementById('callScreen').classList.add('active');
            document.getElementById('currentPinDisplay').textContent = currentPin;

            await startLocalVideo();

            const base = window.location.href.split('?')[0];
            currentQRUrl = `${base}?pin=${currentPin}`;
            generateQR(false);

            setTimeout(() => {
                alert("✅ You are in Room " + currentPin + "\n\nOthers must use the exact same PIN and exchange signaling via the 📡 button.");
            }, 600);
        }

        function generateQR(isLarge) {
            const container = document.getElementById('qrcode');
            container.innerHTML = '';
            new QRCode(container, { text: currentQRUrl, width: isLarge ? 290 : 76, height: isLarge ? 290 : 76 });
        }

        function toggleQRSize() {
            isQRFull = !isQRFull;
            const overlay = document.getElementById('qrOverlay');
            if (isQRFull) {
                overlay.classList.add('full');
                generateQR(true);
            } else {
                overlay.classList.remove('full');
                generateQR(false);
            }
        }

        function toggleMic() {
            isMuted = !isMuted;
            document.getElementById('micBtn').textContent = isMuted ? '🔇' : '🎤';
            if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
        }

        function toggleVideo() {
            isVideoOff = !isVideoOff;
            document.getElementById('videoBtn').textContent = isVideoOff ? '🚫' : '📹';
            if (localStream) localStream.getVideoTracks().forEach(t => t.enabled = !isVideoOff);
        }

        async function restartCamera() {
            await startLocalVideo();
        }

        function endCall() {
            if (confirm("Leave the room?")) location.reload();
        }

        document.addEventListener('keydown', e => {
            if (e.key >= '0' && e.key <= '9') addDigit(e.key);
            if (e.key === 'Backspace') { currentPin = currentPin.slice(0,-1); updatePinDisplay(); }
            if (e.key === 'Enter' && currentPin.length === 4) joinRoom();
        });

        window.onload = checkURLParams;
    </script>
</body>
</html>
