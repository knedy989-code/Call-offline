<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pro P2P Call - Fixed</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; }
        video { width: 45%; background: #111; border-radius: 8px; border: 2px solid #333; }
        .controls { margin: 20px; padding: 20px; background: #111; }
        .btn { padding: 12px; margin: 5px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <video id="local" autoplay playsinline muted></video>
        <video id="remote" autoplay playsinline></video>
    </div>

    <div class="controls">
        <h3>ID: <span id="myID">...</span> <button onclick="copyID()" class="btn">Copy</button></h3>
        <input type="text" id="targetID" placeholder="Friend's ID">
        <button onclick="callFriend()" class="btn" style="background:#007AFF; color:white;">Call</button>
        <button onclick="forceSync()" class="btn" style="background:#FF9500;">Force Sync Video</button>
        <button onclick="enableAudio()" class="btn" style="background:#0f0;">Enable Audio</button>
    </div>

    <script>
        const myIDDisplay = document.getElementById('myID');
        const remoteVideo = document.getElementById('remote');
        let peer, localStream, currentCall;

        async function init() {
            // Explicitly request video AND audio with constraints
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('local').srcObject = localStream;
            
            peer = new Peer();
            peer.on('open', id => myIDDisplay.innerText = id);
            
            // Handle incoming call
            peer.on('call', call => {
                currentCall = call;
                call.answer(localStream); // Send my stream back immediately
                call.on('stream', s => remoteVideo.srcObject = s);
            });
        }

        function callFriend() {
            const id = document.getElementById('targetID').value;
            // Send localStream as the second argument - this is CRITICAL
            currentCall = peer.call(id, localStream);
            currentCall.on('stream', s => remoteVideo.srcObject = s);
        }

        // Fixes "He can't see me" by re-adding the track
        function forceSync() {
            const videoTrack = localStream.getVideoTracks()[0];
            const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
            sender.replaceTrack(videoTrack);
            alert("Video Sync Forced!");
        }

        function enableAudio() {
            remoteVideo.muted = false;
            remoteVideo.play();
        }

        function copyID() {
            navigator.clipboard.writeText(myIDDisplay.innerText);
            alert("ID Copied!");
        }

        init();
    </script>
</body>
</html>
