<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fixed Room P2P</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body { background: #050505; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .video-wrapper { display: flex; gap: 20px; }
        video { width: 40vw; background: #111; border-radius: 12px; }
        .rooms { margin-top: 20px; display: flex; gap: 10px; }
        button { padding: 15px 25px; border-radius: 8px; border: none; background: #222; color: #fff; cursor: pointer; font-size: 1.1rem; }
        button:hover { background: #444; }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <video id="local" autoplay playsinline muted></video>
        <video id="remote" autoplay playsinline></video>
    </div>

    <!-- Pre-set Codes -->
    <div class="rooms">
        <button onclick="connect('1111')">Join Room 1111</button>
        <button onclick="connect('2222')">Join Room 2222</button>
        <button onclick="connect('3333')">Join Room 3333</button>
    </div>

    <script>
        let peer, localStream;

        async function connect(id) {
            // Cleanup existing connection if switching rooms
            if (peer) peer.destroy();
            
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('local').srcObject = localStream;

            peer = new Peer(id); // Use the fixed ID

            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', s => document.getElementById('remote').srcObject = s);
            });

            // Call the same ID to connect to anyone else in this room
            const call = peer.call(id, localStream);
            call.on('stream', s => document.getElementById('remote').srcObject = s);
        }
    </script>
</body>
</html>
